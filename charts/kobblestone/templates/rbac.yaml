{{- if .Values.rbac.create }}
{{- /* Rules are synced verbatim from the operator's generated ClusterRole (files/rbac/operator-role.yaml). */ -}}
{{- $role := .Files.Get "files/rbac/operator-role.yaml" | fromYaml }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kobblestone.fullname" . }}
  labels:
    {{- include "kobblestone.labels" . | nindent 4 }}
rules:
  {{- toYaml $role.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kobblestone.fullname" . }}
  labels:
    {{- include "kobblestone.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kobblestone.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kobblestone.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
